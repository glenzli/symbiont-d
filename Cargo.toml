[package]
name = "symbiont-d"
version = "0.1.0"
edition = "2024"
default-run = "symbiont-d"

[dependencies]
anyhow = "1.0"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
getrandom = "0.4"
imagesize = "0.14"
infer = "0.19"
mail-parser = "0.11"
pcp-client = { path = "../paged-context-protocol/crates/pcp-client" }
pcp-core = { path = "../paged-context-protocol/crates/pcp-core" }
pcp-rpc = { path = "../paged-context-protocol/crates/pcp-rpc" }
pcp-runtime = { path = "../paged-context-protocol/crates/pcp-runtime" }
pcp-sqlite = { path = "../paged-context-protocol/crates/pcp-sqlite" }
pcp-store = { path = "../paged-context-protocol/crates/pcp-store" }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", features = ["ring"] }
toml = "1.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
