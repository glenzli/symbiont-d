[package]
name = "pcp-sqlite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
pcp-core = { path = "../pcp-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
