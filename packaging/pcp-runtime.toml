store_path = "../data/context.sqlite3"

[[endpoints]]
socket_path = "../data/run/pcp-symbiont.sock"
client_id = "host:symbiont-d"
client_type = "host"
client_name = "symbiont-d"
access_mode = "admin"
allowed_scopes = [
  "user:{owner_id}",
  "project:symbiont-d",
  "conversation:symbiont-d-main",
]
allow_cross_scope_derivation = true

[[endpoints]]
socket_path = "../data/run/pcp-operator.sock"
client_id = "operator:local"
client_type = "service"
client_name = "PCP Console"
access_mode = "audit"
allowed_scopes = [
  "user:{owner_id}",
  "project:symbiont-d",
  "conversation:symbiont-d-main",
]

[[endpoints]]
socket_path = "../data/run/pcp-codex-read.sock"
client_id = "codex:pcp-read"
client_type = "model_client"
client_name = "Codex PCP read trial"
access_mode = "read"
allowed_scopes = [
  "user:{owner_id}",
]

[maintenance]
enabled = true
mode = "observe"
state_path = "../data/pcp-maintenance-state.json"
allowed_scopes = [
  "user:{owner_id}",
  "project:symbiont-d",
  "conversation:symbiont-d-main",
]
interval_seconds = 21600
initial_delay_seconds = 300
max_jobs_per_cycle = 3
principal_id = "service:pcp-maintainer"
principal_name = "symbiont-d memory observer"

[maintenance.worker]
program = "../target/release/symbiont-pcp-worker"
args = []
timeout_seconds = 420
actor_id = "model:symbiont-memory-worker"
actor_type = "model"

[maintenance.summary]
enabled = true
minimum_chars = 8000
max_input_chars = 32000
retry_after_seconds = 604800

[maintenance.compaction]
enabled = true
candidate_window = 32
routing_chars_per_page = 480
max_pages_per_candidate = 6
max_input_chars = 64000
retry_after_seconds = 604800

[maintenance.retention]
enabled = true
write_leases = true
minimum_age_days = 30
keep_recent_revisions_per_page = 2
candidate_window = 24
routing_chars_per_page = 420
max_revisions_per_cycle = 3
lease_days = 120
retry_after_seconds = 2592000
