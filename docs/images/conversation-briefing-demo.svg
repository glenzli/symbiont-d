<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">A synthetic symbiont-d external-input briefing in conversation</title>
  <desc id="desc">A fictional desktop conversation showing an external research input, its retained source link, a person taking it up, and a compact visible status bar.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#3a352f" flood-opacity=".14"/></filter>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#f2eee8"/></linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#665f57"/><stop offset="1" stop-color="#24211f"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#eeeae3"/>
  <rect x="52" y="40" width="1336" height="820" rx="26" fill="#fffefd" filter="url(#shadow)"/>
  <rect x="52" y="40" width="1336" height="78" rx="26" fill="url(#top)"/>
  <path d="M78 118H1362" stroke="#e5e0d9"/>
  <circle cx="96" cy="79" r="20" fill="#2d2926"/>
  <path d="M87 76c7-12 19-8 18 3-1 12-12 16-19 12 5-5 6-10 1-15Z" fill="#d8d0c5"/>
  <text x="132" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#292624">symbiont-d</text>
  <text x="132" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#827a72">对话 · 输入简报 · 本地上下文</text>
  <rect x="1186" y="62" width="158" height="34" rx="17" fill="#f1eeea"/>
  <text x="1207" y="85" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#655d56">聚焦对话</text>
  <circle cx="1319" cy="79" r="8" fill="#6d8b72"/>
  <text x="100" y="163" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#77706a">今天 · 外部输入会先留在对话边缘，只有被接住才进入长期上下文</text>

  <circle cx="124" cy="235" r="31" fill="#fff2d9"/>
  <path d="M107 242c-5-18 5-31 20-31 17 0 26 12 22 27-3 13-12 19-24 18-7 0-13-5-18-14Z" fill="url(#avatar)"/>
  <circle cx="121" cy="229" r="3" fill="#f5ede2"/><circle cx="134" cy="229" r="3" fill="#f5ede2"/><path d="M122 240c5 4 10 4 15 0" fill="none" stroke="#f5ede2" stroke-width="2.5" stroke-linecap="round"/>
  <text x="174" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#5f5953">Luna</text>
  <text x="226" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#958d85">外部输入 · 采集于今天 10:12</text>
  <rect x="174" y="233" width="1036" height="180" rx="16" fill="#f8f7f5" stroke="#dedad4" stroke-width="1.5"/>
  <text x="202" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#302d2b">可重复的研究软件，正在成为科学结论的一部分</text>
  <text x="202" y="309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#4c4742">一项虚构的研究简报指出：数据、运行环境与分析脚本一同公开时，</text>
  <text x="202" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#4c4742">同行不只复核结论，也能复核结论如何被得到。它值得讨论的不是“更开放”，</text>
  <text x="202" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#4c4742">而是研究软件何时应被视为方法与证据的一部分。</text>
  <rect x="174" y="429" width="100" height="29" rx="14" fill="#fffefd" stroke="#dcd7d0"/>
  <text x="194" y="449" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#726a62">› 说明</text>
  <rect x="284" y="429" width="114" height="29" rx="14" fill="#fffefd" stroke="#dcd7d0"/>
  <text x="302" y="449" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#726a62">› 2 个来源</text>
  <text x="174" y="488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#9a928b">这是一条虚构的外部输入；原文、来源和删除都仍然可用。</text>
  <path d="M1163 438h23" stroke="#9b938c" stroke-width="2" stroke-linecap="round"/><path d="m1179 430 8 8-8 8" fill="none" stroke="#9b938c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="1310" cy="516" r="31" fill="#e8dfd1"/>
  <path d="M1294 527c1-20 10-31 23-31 16 0 25 12 22 28-3 12-11 20-24 20-12 0-20-6-21-17Z" fill="#4b4741"/>
  <text x="881" y="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#958d85">你 · 10:14</text>
  <rect x="504" y="513" width="768" height="100" rx="18" fill="#f1efec" stroke="#d2ccc4" stroke-width="1.5"/>
  <text x="535" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#33302d">这不只是“开源更好”：如果运行环境本身改变了结论，</text>
  <text x="535" y="581" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#33302d">它是否也应成为论文可引用的对象？</text>

  <circle cx="124" cy="686" r="31" fill="#f0ede7"/>
  <path d="M108 696c-3-19 8-32 21-32 16 0 25 12 21 28-3 12-11 20-23 20-8 0-15-5-19-16Z" fill="#665f57"/>
  <path d="M112 698c6 8 16 11 26 5" fill="none" stroke="#dcd3c7" stroke-width="3" stroke-linecap="round"/>
  <text x="174" y="667" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#5f5953">symbiont-d</text>
  <text x="282" y="667" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#958d85">10:15</text>
  <rect x="174" y="682" width="1036" height="103" rx="16" fill="#fffefd" stroke="#d8d3cc" stroke-width="1.5"/>
  <text x="202" y="722" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#34312e">对。更准确地说，它把“复现”从结果检查扩展为一条可追溯的生产链。</text>
  <text x="202" y="751" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#34312e">下一步值得区分：哪些依赖必须存档，哪些只需被精确描述。</text>
  <rect x="100" y="812" width="1240" height="30" rx="15" fill="#f4f1ec"/>
  <circle cx="124" cy="827" r="5" fill="#728f76"/>
  <text x="141" y="833" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#726a62">状态：对话空闲 · 外部输入将在未被接住时按你的保留期自动清理</text>
</svg>
